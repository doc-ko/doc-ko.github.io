name: Build check

on:
  # Build every pull request before it can merge into `main`
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build the site
        run: npm run build
      - name: Install the test browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Check the grid, accessibility and reduced motion
        run: npx playwright test
